<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>Spotify — Your music</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 3v18M8 5v16M12 4v17M17 6l3 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l11 6.6a1.7 1.7 0 0 1 0 2.9l-11 6.6c-.7.4-1.6-.1-1.6-.9z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5.5c0-.8-.9-1.2-1.5-.8l-9 6a1.6 1.6 0 0 0 0 2.6l9 6c.6.4 1.5 0 1.5-.8z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5.5c0-.8.9-1.2 1.5-.8l9 6a1.6 1.6 0 0 1 0 2.6l-9 6c-.6.4-1.5 0-1.5-.8z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17 3h4v4M3 7h3c5 0 7 10 12 10h3M17 17h4v4M3 17h3c2 0 3.4-1.5 4.5-3M14 7c1-1.4 2-2 4-2h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.2-8.8 11-8.8 11S3.2 13.9 3.2 8.7a4.7 4.7 0 0 1 8.8-2.3 4.7 4.7 0 0 1 8.8 2.3Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-devices" viewBox="0 0 24 24"><rect x="2.5" y="4" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 20h5M9.5 15v5m10-9h2v10h-7V11h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 9a5 5 0 0 1 0 6m2.5-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h13M3 11h13M3 16h8m5-1 5 3-5 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <div class="app">
    <aside class="sidebar">
      <nav class="nav" aria-label="Main navigation">
        <div class="brand"><span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M5.5 9.2c4.4-1.2 9.4-.8 13.1 1.2M6.3 12.4c3.8-1 8-.6 11.2 1.2M7.2 15.3c3-.7 6.3-.4 8.9 1.1" fill="none" stroke="#1ed760" stroke-width="1.6" stroke-linecap="round"/></svg></span>Spotify</div>
        <button class="nav-link active" id="search-nav"><svg><use href="#i-search"/></svg>Search</button>
      </nav>
      <section class="library">
        <div class="library-top"><div class="library-title"><svg><use href="#i-library"/></svg>Your Library</div></div>
      </section>
    </aside>

    <main class="content" id="main-content">
      <header class="topbar"><div class="history"><button class="icon-button" aria-label="Go back"><svg width="20" height="20"><use href="#i-chevron-left"/></svg></button><button class="icon-button" aria-label="Go forward"><svg width="20" height="20"><use href="#i-chevron-right"/></svg></button></div></header>
      <div class="page search-page">
        <h1>Search</h1>
        <form id="search-form" role="search">
          <label class="search-box"><svg><use href="#i-search"/></svg><input id="search-input" type="search" placeholder="What do you want to play?" autocomplete="off" aria-label="Search songs and artists"></label>
          <button class="pill" type="submit">Search</button>
        </form>
        <div id="search-status" role="status" aria-live="polite"></div>
        <section id="results" aria-label="Search results"></section>
      </div>
    </main>

    <footer class="player" aria-label="Music player">
      <div class="now-playing"><img id="now-art" src="" alt="" hidden><div class="track-info"><strong id="now-title"></strong><span id="now-artist"></span></div></div>
      <div class="controls"><div class="control-row"><button class="control skip" aria-label="Previous" disabled><svg><use href="#i-prev"/></svg></button><button class="control play" id="play-toggle" aria-label="Play" disabled><svg><use href="#i-play"/></svg></button><button class="control skip" aria-label="Next" disabled><svg><use href="#i-next"/></svg></button><button class="control repeat" id="loop-toggle" aria-label="Loop off" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button></div><div class="timeline"><span id="elapsed">0:00</span><div class="range" id="seek-bar"><span id="progress" style="width:0"></span></div><span id="duration">0:00</span></div></div>
      <div class="extra-controls"><button class="control" aria-label="Queue"><svg><use href="#i-queue"/></svg></button><button class="control" aria-label="Connect to a device"><svg><use href="#i-devices"/></svg></button><button class="control" aria-label="Volume"><svg><use href="#i-volume"/></svg></button><div class="range volume"><span></span></div></div>
    </footer>
    <nav class="mobile-nav" aria-label="Mobile navigation"><button class="active" id="mobile-search-nav"><svg><use href="#i-search"/></svg>Search</button><button><svg><use href="#i-library"/></svg>Your Library</button></nav>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
