name: rhythm_app
description: Rhythm — on-device music, playlists, and personal listening stories.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio:
    path: third_party/just_audio
  youtube_explode_dart:
    path: third_party/youtube_explode_dart
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  audio_service: ^0.18.19
  audio_session: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
