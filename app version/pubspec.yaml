name: rhythm_app
description: Rhythm — on-device music, playlists, and personal listening stories.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  youtube_explode_dart: ^3.1.0
  path_provider: ^2.1.6
  ytdlp_flutter: ^0.1.0
  file_selector: ^1.1.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
